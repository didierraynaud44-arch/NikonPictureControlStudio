<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nikon Picture Control Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête Dynamique -->
    <header class="app-header">
        <!-- Actions Vue 1 (Studio) -->
        <div id="header-studio-actions" class="header-buttons">
            <button id="exportJpg" class="btn-action btn-success" style="display: none;">📸 Exporter JPG</button>
        </div>

        <!-- Actions Vue 2 (Gestionnaire) -->
        <div id="header-profile-actions" class="header-buttons" style="display: none;">
            <button id="openNP3" class="btn-primary">📂 Importer un NP3</button>
            <button id="saveNP3" class="btn-action">💾 Exporter pour Z50 II (.NP3)</button>
            <button id="exportNCP" class="btn-action">💾 Exporter pour Z6 II (.NCP)</button>
        </div>
    </header>

    <!-- VUE 1 : Studio (3 Colonnes) -->
    <main id="view-studio" class="app-main view-active">
        
        <!-- Colonne Gauche Studio : Catalogue & Dossiers Photo -->
        <aside class="sidebar-panel folder-tree-panel">
            <h2 style="font-size: 15px; color: #fff; margin: 0 0 10px 0; border-bottom: 1px solid #444; padding-bottom: 6px;">Catalogue</h2>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0; font-size: 13px; color: #ccc;">📁 Dossiers Photos</h3>
                <button id="btnStudioOpenFolder" class="btn-tool" style="padding: 3px 6px; font-size: 11px;" title="Importer un dossier">＋ Ouvrir</button>
            </div>
            
            <!-- Zone de l'arborescence des répertoires et fichiers -->
            <div id="studioFolderTree" class="folder-tree-container" style="flex: 1; overflow-y: auto; background: #1e1e1e; border: 1px solid #333; border-radius: 4px; padding: 6px;">
                <p style="color:#777; font-size:11px; font-style:italic; padding:8px; margin:0;">Aucun dossier importé</p>
            </div>
        </aside>

        <!-- Colonne Centre : Canvas & EXIF & Grille Batch -->
        <section class="preview-panel">
            <!-- Barre de mode d'affichage -->
        <div class="view-mode-toolbar">
                <div class="view-mode-switch">
                    <button id="btnViewSingle" class="btn-tool active" title="Affichage unique">🖼️ Photo</button>
                    <button id="btnViewGrid" class="btn-tool" title="Affichage galerie">⣿ Galerie (<span id="selectedCount">0</span>)</button>
                </div>
                <div class="view-mode-actions">
                    <button id="btnBatchExport" class="btn-tool btn-primary" style="display: none;">
                        💾 Exporter la sélection
                    </button>
                </div>
            </div>

      
       <!-- Mode Photo Seule (Actuel) -->
            <div id="singleImageContainer" class="canvas-container" style="position: relative;">
                <!-- Flèche Gauche -->
                <button class="studio-nav-btn studio-prev-btn" onclick="navigateStudioPhoto(-1)" title="Photo précédente (Flèche gauche)">❮</button>
                
                <div class="canvas-stack">
                    <canvas id="previewCanvas"></canvas>
                    <canvas id="maskOverlayCanvas"></canvas>
                </div>

                <!-- Flèche Droite -->
                <button class="studio-nav-btn studio-next-btn" onclick="navigateStudioPhoto(1)" title="Photo suivante (Flèche droite)">❯</button>
            </div>
	   

            <!-- Mode Galerie Grille (Nouveau) -->
            <div id="gridImageContainer" class="grid-container" style="display: none;">
                <div class="grid-scroll-area" id="gridItemsWrapper">
                    <!-- Les cartes images seront générées dynamiquement ici -->
                </div>
            </div>

            <!-- Barre EXIF (Conservée sous le conteneur) -->
            <div id="exifInfo" class="exif-bar">
                <span id="exifCamera">-</span> | 
                <span id="exifLens">-</span> | 
                <span id="exifParams">-</span>
            </div>
        </section>

        <!-- Colonne Droite : Réglages Picture Control + Masques + Rotation -->
        <aside class="sidebar-panel">
            <div id="pictureControlStatus" class="card-panel"></div>
            <div id="masksPanelStatus" class="card-panel" style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #5865f2;"></div>

            <!-- Panneau Outils de Rotation & Miroir -->
            <div class="panel-section card-panel" id="panel-rotation" style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #333;">
                <h3 style="font-size: 13px; color: #ccc; margin-bottom: 10px;">Orientation & Rotation</h3>
                
                <!-- Boutons d'action rapide -->
                <div class="rotation-buttons" style="display: flex; gap: 6px; margin-bottom: 12px;">
                    <button id="btnRotateLeft" class="btn-tool" title="Rotation 90° Gauche">⟲ -90°</button>
                    <button id="btnRotateRight" class="btn-tool" title="Rotation 90° Droite">⟳ +90°</button>
                    <button id="btnFlipH" class="btn-tool" title="Inversion Horizontale">⇄ Miroir H</button>
                    <button id="btnFlipV" class="btn-tool" title="Inversion Verticale">⇅ Miroir V</button>
                </div>

                <!-- Ajustement fin avec curseur et saisie numérique -->
                <div class="control-group">
                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; margin-bottom: 6px;">
                        <label for="rangeRotationDegree">Angle fin :</label>
                        <div style="display:flex; align-items:center; gap:3px;">
                            <input type="number" id="inputRotationDegree" min="-45" max="45" step="0.1" value="0" 
                                   style="width: 55px; background: #1e1e1e; color: #fff; border: 1px solid #444; border-radius: 3px; padding: 2px 4px; text-align: right; font-size: 12px;">
                            <span style="color: #aaa; font-size: 12px;">°</span>
                        </div>
                    </div>
                    <input type="range" id="rangeRotationDegree" min="-45" max="45" value="0" step="0.1" style="width:100%;">
                    <button id="btnResetRotation" class="btn-secondary" style="margin-top: 8px; width: 100%; font-size: 11px;">Réinitialiser la rotation</button>
                </div>
            </div>
        </aside>

    </main>

    <!-- VUE 2 : Gestionnaire de Profils -->
    <main id="view-profiles" class="app-main view-hidden" style="display: none;">

        <!-- Colonne Gauche : Bibliothèque Profils -->
        <aside class="sidebar-panel np3-library-panel">
            <h3>Bibliothèque Profils</h3>
            <div id="np3ListContainerProfiles" class="np3-list"></div>
        </aside>

        <!-- Colonne Centre : Aperçu du profil -->
        <section class="preview-panel">
            <div class="canvas-container">
                <canvas id="profilePreviewCanvas"></canvas>
            </div>
        </section>

        <!-- Colonne Droite : Réglages Picture Control compacts -->
        <aside class="sidebar-panel">
            <div id="profileControlStatus" class="card-panel"></div>
        </aside>

    </main>

    <!-- MODALE D'EXPORTATION CONFIGURABLE -->
    <div id="exportModal" class="modal-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9999; align-items:center; justify-content:center;">
        <div style="position:relative; background:#202124; border:1px solid #3c4043; border-radius:8px; padding:20px; width:460px; color:#e8eaed; font-family:sans-serif;">
            
            <!-- Bouton Croix Fermer Modale -->
            <button id="btnCloseExportModal" style="position:absolute; top:12px; right:12px; background:transparent; border:none; color:#aaa; font-size:16px; cursor:pointer;" title="Fermer">✕</button>

            <h3 style="margin-top:0; color:#5865f2; font-size:16px;">📤 Exporter l'image</h3>

            <!-- 1. Dossier de destination -->
            <div style="margin-bottom:12px;">
                <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">1. Dossier de destination :</label>
                <div style="display:flex; gap:6px;">
                    <input type="text" id="expFolderPath" readonly placeholder="Aucun dossier sélectionné" style="flex:1; background:#171717; border:1px solid #444; color:#fff; padding:6px; border-radius:4px; font-size:11px;">
                    <button id="btnBrowseExpFolder" style="background:#3c4043; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer;">Parcourir</button>
                </div>
            </div>

            <!-- 2. Format de sortie -->
            <div style="margin-bottom:12px;">
                <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">2. Format de sortie :</label>
                <select id="expFormat" style="width:100%; background:#171717; border:1px solid #444; color:#fff; padding:6px; border-radius:4px;">
                    <option value="image/jpeg">JPEG (.jpg)</option>
                    <option value="image/png">PNG (.png)</option>
                    <option value="image/tiff">TIFF (.tif)</option>
                    <option value="image/x-adobe-dng">DNG (.dng)</option>
                    <option value="application/pdf">PDF (.pdf)</option>
                </select>
            </div>

            <!-- 3. Taux de compression -->
            <div style="margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; margin-bottom:4px;">
                    <span>3. Qualité / Compression :</span>
                    <span id="expQualityVal">90%</span>
                </div>
                <input type="range" id="expQuality" min="10" max="100" value="90" style="width:100%;">
            </div>

            <!-- 4. Dimensions et Résolution -->
            <div style="margin-bottom:12px; border-top:1px solid #333; padding-top:10px;">
                <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:6px;">4. Dimensions &amp; Résolution :</label>
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;">
                    <div>
                        <span style="font-size:10px; color:#aaa;">Largeur (px)</span>
                        <input type="number" id="expWidth" placeholder="Auto" style="width:100%; background:#171717; border:1px solid #444; color:#fff; padding:4px; border-radius:4px;">
                    </div>
                    <div>
                        <span style="font-size:10px; color:#aaa;">Hauteur (px)</span>
                        <input type="number" id="expHeight" placeholder="Auto" style="width:100%; background:#171717; border:1px solid #444; color:#fff; padding:4px; border-radius:4px;">
                    </div>
                    <div>
                        <span style="font-size:10px; color:#aaa;">Résolution (DPI)</span>
                        <input type="number" id="expDpi" value="300" style="width:100%; background:#171717; border:1px solid #444; color:#fff; padding:4px; border-radius:4px;">
                    </div>
                </div>
            </div>

            <!-- 5. Métadonnées -->
            <div style="margin-bottom:18px; border-top:1px solid #333; padding-top:10px;">
                <label style="font-size:12px; cursor:pointer; display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="expStripExif">
                    <span>5. Supprimer les métadonnées (EXIF)</span>
                </label>
            </div>

            <!-- Boutons d'action -->
            <div style="display:flex; justify-content:flex-end; gap:8px;">
                <button id="btnCancelExport" style="background:transparent; border:1px solid #555; color:#fff; padding:6px 14px; border-radius:4px; cursor:pointer;">Annuler</button>
                <button id="btnConfirmExport" style="background:#5865f2; border:none; color:#fff; padding:6px 16px; border-radius:4px; cursor:pointer; font-weight:bold;">Lancer l'export</button>
            </div>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="core/ImageBuffer.js"></script>
    <script src="core/DisplayCanvas.js"></script>
    <script src="core/RenderPipeline.js"></script>
    <script src="core/BaseFilter.js"></script>

    <!-- Filtres -->
    <script src="filters/WhiteBalanceFilter.js"></script>
    <script src="filters/ContrastFilter.js"></script>
    <script src="filters/BrightnessFilter.js"></script>
    <script src="filters/HighlightsFilter.js"></script>
    <script src="filters/ShadowsFilter.js"></script>
    <script src="filters/SaturationFilter.js"></script>
    <script src="filters/SharpenFilter.js"></script>
    <script src="filters/MidRangeSharpenFilter.js"></script>
    <script src="filters/ClarityFilter.js"></script>
    <script src="filters/ExposureFilter.js"></script>
    <script src="filters/BlackWhitePointFilter.js"></script>
    <script src="filters/ToneCurveFilter.js"></script>
    <script src="filters/ColorBlenderFilter.js"></script>
    <script src="filters/ColorGradingFilter.js"></script>
    <script src="filters/MonochromeFilter.js"></script>
    <script src="filters/DehazeFilter.js"></script>
    <script src="filters/VibranceFilter.js"></script>
    <script src="filters/SCurveFilter.js"></script>
    <script src="filters/VignetteFilter.js"></script>
    <script src="filters/DenoiseFilter.js"></script>

    <!-- UI & Moteur -->
    <script src="components/ToneCurveWidget.js"></script>
    <script src="core/ImageProcessor.js"></script>
    <script src="components/exifPanel.js"></script>
    <script src="components/pictureControlPanel.js"></script>
    <script src="components/GridManager.js"></script>

    <!-- Masques locaux (Studio uniquement) -->
    <script src="core/MaskEngine.js"></script>
    <script src="core/MasksManager.js"></script>
    <script src="components/MaskCanvasController.js"></script>
    <script src="components/masksPanel.js"></script>
    <script src="app.js"></script>
</body>
</html>
