<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nikon Picture Control Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. En-tête principal -->
    <header class="app-header">
        <h1>Nikon Picture Control Studio</h1>
        
        <!-- Page 1 : Actions Studio -->
        <div id="header-studio-actions" class="header-buttons">
            <button id="openNef">📂 Ouvrir une image / RAW</button>
            <button id="btnOpenProfilesPage" class="btn-action">🎛️ Gestionnaire de Profils Nikon</button>
            <button id="exportJpg" class="btn-action btn-success">📸 Exporter JPG</button>
        </div>

        <!-- Page 2 : Actions Gestionnaire -->
        <div id="header-profile-actions" class="header-buttons" style="display: none;">
            <button id="openNP3" class="btn-primary">📂 Importer un NP3</button>
            <button id="saveNP3" class="btn-action">💾 Enregistrer NP3 Z50 II</button>
            <button id="exportNCP" class="btn-action">💾 Exporter pour Z6 II (.NCP)</button>
            <button id="btnReturnToStudio" class="btn-secondary">⬅️ Retour au Studio</button>
        </div>
    </header>

    <!-- 2. VUE 1 : Studio (Canvas + Barre EXIF + Panneau Réglages à droite) -->
    <main id="view-studio" class="app-main view-active">
        
        <!-- Zone Centrale : Image et EXIF -->
        <section class="preview-panel">
            <div class="canvas-container">
                <canvas id="previewCanvas"></canvas>
            </div>
            <!-- Barre d'informations EXIF -->
            <div id="exifInfo" class="exif-bar">
                <span id="exifCamera">-</span> | 
                <span id="exifLens">-</span> | 
                <span id="exifParams">-</span>
            </div>
        </section>

        <!-- Zone Droite : Panneau de réglages et de traitement -->
        <aside class="sidebar-panel">
            <div id="pictureControlStatus" class="card-panel">
                <!-- Généré dynamiquement par pictureControlPanel.js -->
            </div>
        </aside>

    </main>

    <!-- 3. VUE 2 : Gestionnaire de Profils (Bibliothèque NP3 + Canvas + Réglages) -->
    <main id="view-profiles" class="app-main view-hidden" style="display: none;">
        
        <!-- Colonne 1 : Bibliothèque NP3 -->
        <aside class="sidebar-panel np3-library-panel">
            <h3>Bibliothèque NP3</h3>
            <div id="np3ListContainer" class="np3-list"></div>
        </aside>

        <!-- Colonne 2 : Canvas d'aperçu du profil -->
        <section class="preview-panel">
            <div class="canvas-container">
                <canvas id="profilePreviewCanvas"></canvas>
            </div>
        </section>

        <!-- Colonne 3 : Panneau de réglages du profil -->
        <aside class="sidebar-panel">
            <div id="pictureControlStatusProfile" class="card-panel">
                <!-- Conteneur secondaire si besoin -->
            </div>
        </aside>

    </main>

    <!-- Scripts -->
    <script src="core/ImageBuffer.js"></script>
    <script src="core/DisplayCanvas.js"></script>
    <script src="core/RenderPipeline.js"></script>
    <script src="core/BaseFilter.js"></script>

    <script src="filters/ContrastFilter.js"></script>
    <script src="filters/BrightnessFilter.js"></script>
    <script src="filters/HighlightsFilter.js"></script>
    <script src="filters/ShadowsFilter.js"></script>
    <script src="filters/SaturationFilter.js"></script>
    <script src="filters/SharpenFilter.js"></script>
    <script src="filters/MidRangeSharpenFilter.js"></script>
    <script src="filters/ClarityFilter.js"></script>
    <script src="filters/ToneCurveFilter.js"></script>
    <script src="filters/ColorBlenderFilter.js"></script>
    <script src="filters/ColorGradingFilter.js"></script>
    <script src="filters/MonochromeFilter.js"></script>
    <script src="filters/DehazeFilter.js"></script>
    <script src="filters/VibranceFilter.js"></script>
    <script src="filters/SCurveFilter.js"></script>
    <script src="filters/VignetteFilter.js"></script>
    <script src="filters/DenoiseFilter.js"></script>
    <script src="filters/LensCorrectionFilter.js"></script>

    <script src="components/ToneCurveWidget.js"></script>
    <script src="core/ImageProcessor.js"></script>
    <script src="components/exifPanel.js"></script>
    <script src="components/pictureControlPanel.js"></script>
    <script src="app.js"></script>
</body>
</html>
